<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        html{
            box-sizing: border-box;
            font-size: 10px;
            font-family: sans-serif;
        }
        body{margin: 0 10px;}
        h1{
            font-size: 16px;
            margin: 0 0 16px 0;
            width: 100%;
            text-align: center;
        }
        ul{
            list-style: none;
            margin: 16px 0;
            padding: 0;
            font-size: 16px;
        }
        li>b{
            color: red;
            font-size: 14px;
        }
        button{
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            color: #fff;
            background: #369;
            font-size: 14px;
            width: 50%;
            margin: auto 0 16px auto;
        }
    </style>
</head>
<body>
    
</body>
</html>
