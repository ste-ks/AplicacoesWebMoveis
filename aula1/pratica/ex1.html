<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Mesclada</title>
</head>
<body>
    <h2>Mesclagem</h2>

    <table width ="50%" border="1">
        <tr>
            <th>Titulo1</th>
            <th>Titulo2</th>
            <th>Titulo3</th>            
        </tr>
        <tr>
            <td colspan="2">1 x 1,2</td>
            <td rowspan="2">1,2 x 3</td>
        </tr>
        <tr>
            <td>2x1</td>
            <td>2x2</td>
        </tr>
        <tr>
            <td>3x1</td>
            <td>3x2</td>
            <td>3x3</td>
        </tr>

    </table>
    
</body>
</html>
