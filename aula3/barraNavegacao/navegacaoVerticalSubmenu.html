<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            background-color: #f1f1f1;
            width: 200px;
        }

        /*Agora Vamos posicionar os itens da lista, vamos definir o posicionamento com o valor relative, porque depois iremos posicionar os sub-menus na posição absoluta em relação a eles .*/
        ul li{position: relative;}

        /*Agora vamos estilizar os sub-menus. Queremos cada sub-menu ao lado direito do seu elemento pai assim que passarmos o mouse sobre ele. Com as propriedades CSS Left e Top podemos posicionar cada item do sub-menu ao lado de seu item pai. Definimos o display: none; para que o sub-menu não fique visível por padrão. Listagem 5: Posicionando itens do sub-menu */
        li ul{
            position: absolute;
            left: 199px;
            top: 0;
            display: none;
        }

        /*Agora vamos dar uma aparência melhor aos nossos links. É importante definir display:block; para que cada link ocupe toda a largura definida para ele na lista. Listagem 6: Melhorando aparência dos links*/
        ul li a {
            display: block;
            text-decoration: none;
            color: #000;
            /* background: #fff; */
            /* padding: 5px; */
            padding: 8px 16px;
            /* border: 1px solid #ccc; */
        }

        /*Agora vamos dar uma aparência melhor pro nosso menu quando passarmos o mouse em cima dele, vamos adicionar o código da listagem 10, deixando os links em negrito, sublinhado e com um background. Listagem 10: Estilizando a Classe Hover*/
        ul li a:hover {
            text-decoration: underline;
            color: white;
            font-weight: bold;
            background: #555;
        }

        /*Listagem 8: Exibindo o Submenu*/
        li:hover ul {
            display: block;
        }

    </style>
</head>
<body>
    <h2>Barra de navegacao vertical</h2>
    <ul>
        <li><a href="home">Home</a>
            <ul>
                <li><a href="#about">Sobre nos</a></li>
                <li><a href="#stores">Nossas lojas</a></li>
            </ul>
        </li>
        <li><a href="news">Noticias</a></li>
        <li><a href="contato">Contao</a></li>
    </ul>
</body>
</html>
