<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            background-color: #f1f1f1;
            /* Ativa o Flexbox: os itens ficam automaticamente lado a lado */
            display: inline-flex;
        }
        /* O float:left não é mais necessário! */
        /* li{float: left;} */

        li a{
            display: block;
            color: #000;
            padding: 8px 16px;
            text-decoration-line: none;
        }
        
        li a:hover{
            background-color: #555;
            color: white;
        }
    </style>
</head>
<body>
    <h2>Barra de navegacao vertical</h2>
    <ul>
        <li><a href="home">Home</a></li>
        <li><a href="news">Noticias</a></li>
        <li><a href="contato">Contao</a></li>
    </ul>
</body>
</html>
