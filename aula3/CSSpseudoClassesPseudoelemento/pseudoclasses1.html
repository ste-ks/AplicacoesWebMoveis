<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatacao em CSS</title>
    <style>
        a.estilo1:link{color: red;}
        a.estilo1:visited{color: blue;}
        a.estilo1:hover{color: yellow;}

        a.estilo2:link{color: red;}
        a.estilo2:visited{color: blue;}
        a.estilo2:hover{font-size: 150%;}

        a.estilo3:link{color: red;}
        a.estilo3:visited{color: blue;}
        a.estilo3:hover{color: green;}

        a.estilo4:link{color: red;}
        a.estilo4:visited{color: blue;}
        a.estilo4:hover{font-family: 'Courier New', Courier, monospace;}

        a.estilo5:link{color: red;}
        a.estilo5:visited{color: blue; text-decoration: none;}
        a.estilo5:hover{text-decoration: underline;}

    </style>
</head>
<body>
    <h1>Pseudoclasses em link</h1>
    <p>Passe com o ponteiro do mouse sobre os hiperlinks e veja as diferentes reacoes</p>
    <a class="estilo1" href="#1">Muda cor</a><br>
    <a class="estilo2" href="#2">Muda tamanho</a><br>
    <a class="estilo3" href="#3">Muda cor de fundo</a><br>
    <a class="estilo4" href="#4">Muda tipo da letra</a><br>
    <a class="estilo5" href="#5">Muda decoracao do texto</a><br>
</body>
</html>
