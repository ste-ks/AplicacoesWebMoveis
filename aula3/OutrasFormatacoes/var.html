<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --dourado: #deb44b;
            --branco: #fff;
        }

        body{
            background-color: var(--dourado);
        }

        h2{
            border-bottom: 2px solid var(--dourado);
        }

        .container{
            color: var(--dourado);
            background-color: var(--branco);
            padding: 15px;
        }

        button{
            background-color: var(--branco);
            color: var(--dourado);
            border: 1px solid var(--dourado);
            padding: 5px;
        }

    </style>
</head>
<body>
    <h1>Funcao var()</h1>

    <div class="container">
        <h2>Lorem, ipsum.</h2>
        <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Suscipit, debitis.</p>
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Magni, nostrum.</p>
        <p>
            <button>Sim</button>
            <button>Nao</button>
        </p>
    </div>
</body>
</html>
