<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOX Model</title>
    <style>
        div {
            width: 350px;
            padding: 10px;
            border: 5px dotted green;
            margin: 0;
            background-color: burlywood;
            box-sizing: border-box;/* Faz com que toda as outras medidas fiquem dentro do declarado em width */
            /* caso nao insira o box-sizing é somado os valores das camadas do box model */
        }
    </style>
</head>
<body>
    <br>
    <br>
    <br>
    <br>
    <div>Conteudo</div>
</body>
</html>
