<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    ul {
    list-style-type: none;
    margin: 0;
    padding: 0;
    background-color: #f1f1f1;
    }
li{float:left;}
li a {
     display: block;
     color: #000;
     padding: 8px 16px;
     text-decoration: none;
     }
li a:hover {
    background-color: #555;
    color: white;
    }
    </style>
</head>
<body>

        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#servicos">Serviços</a></li>
            <li><a href="#portfolio">Portfólio</a></li>
            <li><a href="#contato">Contato</a></li>
        </ul>
    

    <div class="conteudo">
        <h1>Bem-vindo ao site!</h1>
        <p>Observe como a lista com as tags de link se transformou em uma barra de navegação no topo da página graças ao CSS.</p>
        <p>Passe o mouse sobre os links do menu para ver o efeito hover em ação (fundo escuro e texto branco).</p>
    </div>
</body>
</html>
