<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        var janelaAberta = window.open('','','width=400,height=400');
        function testarJanela(){
            if (janelaAberta.closed){
                alert('A janela foi fechada');
            } else{
                alert('A janela foi aberta');
            };
        }
    </script>
</head>
<body>
    <button type="button" onclick="testarJanela()">Testar Janela</button>
</body>
</html>
